<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jungle - Avatar AI Low-Latency</title>
    <style>
        /* CSS necesario para el BTL: Modelo a pantalla completa */
        * { box-sizing: border-box; }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05080c;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            user-select: none;
        }
        canvas { display: block; }

        /* Pantalla de bienvenida (Overlay) */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(17, 24, 39, 0.92) 0%, rgba(5, 8, 12, 0.98) 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000; color: white; transition: opacity 0.6s ease;
            text-align: center; padding: 20px;
        }
        #overlay h1 {
            font-size: clamp(28px, 4vw, 44px);
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #10b981;
            text-shadow: 0 0 24px rgba(16, 185, 129, 0.4);
        }
        #overlay p {
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 30px;
        }
        #btnIniciar {
            padding: 20px 44px; font-size: 22px; cursor: pointer;
            background-color: #10b981;
            color: #0f172a; border: none; border-radius: 12px; font-weight: 800;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.45);
            transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        #btnIniciar:hover {
            background-color: #34d399;
            transform: scale(1.04);
            box-shadow: 0 0 40px rgba(52, 211, 153, 0.7);
        }

        /* Barra de progreso de carga del modelo 3D */
        #loading-box {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 300px;
            margin-top: 10px;
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background: #1e293b;
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        #progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #38bdf8);
            transition: width 0.2s ease;
        }
        #loading-text {
            margin-top: 12px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Contenedor Three.js */
        #threejs-container { width: 100vw; height: 100vh; }

        /* Banner Attract Loop (Inactividad) */
        #attract-banner {
            position: absolute;
            top: 8%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #f8fafc;
            padding: 14px 28px;
            border-radius: 999px;
            font-size: clamp(16px, 2.2vw, 22px);
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.25);
            z-index: 400;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            white-space: nowrap;
        }
        #attract-banner.visible {
            opacity: 1;
            animation: floatPulse 3s ease-in-out infinite;
        }
        @keyframes floatPulse {
            0%, 100% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-6px); }
        }

        /* Caja de Subtítulos (Controlada desde Admin) */
        #subtitles-container {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            width: min(88vw, 820px);
            text-align: center;
            z-index: 450;
            pointer-events: none;
            display: none; /* Activable desde Admin */
            flex-direction: column;
            gap: 8px;
        }
        .subtitle-bubble {
            display: inline-block;
            margin: 0 auto;
            padding: 12px 22px;
            border-radius: 14px;
            background: rgba(15, 23, 42, 0.82);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f8fafc;
            font-size: clamp(16px, 2vw, 21px);
            line-height: 1.4;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s ease;
        }
        .subtitle-user {
            color: #38bdf8;
            font-size: clamp(14px, 1.6vw, 17px);
            border-color: rgba(56, 189, 248, 0.3);
        }
        .subtitle-ai {
            color: #ffffff;
            border-color: rgba(16, 185, 129, 0.4);
        }

        /* HUD Inferior de Estado y Voz */
        #totem-hud {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            z-index: 500;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: opacity 0.4s ease, border-color 0.3s ease;
        }
        #hud-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 12px #10b981;
            transition: background 0.3s, box-shadow 0.3s, transform 0.1s;
        }
        #hud-meter-wrap {
            width: 70px;
            height: 6px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
            overflow: hidden;
        }
        #hud-meter-bar {
            width: 0%;
            height: 100%;
            background: #10b981;
            border-radius: 99px;
            transition: width 0.06s linear, background 0.3s;
        }

        /* Acceso discreto al Admin en la esquina inferior derecha */
        #admin-shortcut {
            position: absolute;
            bottom: 14px;
            right: 16px;
            z-index: 600;
            color: rgba(148, 163, 184, 0.25);
            text-decoration: none;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            transition: 0.2s;
        }
        #admin-shortcut:hover {
            color: #f8fafc;
            background: rgba(30, 41, 59, 0.8);
        }
    </style>

    <!-- Import Map para Three.js Moderno (ES Modules r160) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="overlay">
        <h1>🦁 JUNGLE - AVATAR AI 🦁</h1>
        <p id="overlay-subtitle">Toca para cargar el modelo 3D y activar el micrófono.</p>
        <button id="btnIniciar">Comenzar Experiencia BTL</button>
        <div id="loading-box">
            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>
            <div id="loading-text">Descargando modelo 3D (0%)...</div>
        </div>
    </div>

    <!-- Banner Modo Attract Loop -->
    <div id="attract-banner">👋 ¡Hola! Acércate al micrófono y háblame</div>

    <!-- Subtítulos en Tiempo Real (Habilitables desde el Panel de Administrador /admin.html) -->
    <div id="subtitles-container">
        <div id="subtitle-user" class="subtitle-bubble subtitle-user" style="display: none;"></div>
        <div id="subtitle-ai" class="subtitle-bubble subtitle-ai" style="display: none;"></div>
    </div>

    <!-- HUD Inferior de Estado -->
    <div id="totem-hud" style="opacity: 0;">
        <div id="hud-dot"></div>
        <span id="hud-status-text">Iniciando...</span>
        <div id="hud-meter-wrap">
            <div id="hud-meter-bar"></div>
        </div>
    </div>

    <a id="admin-shortcut" href="/admin.html" target="_blank" title="Panel de Administración">⚙️ Admin</a>

    <div id="threejs-container"></div>

    <script type="module" src="main.js"></script>

</body>
</html>
